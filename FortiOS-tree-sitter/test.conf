# Global settings
config system global
    set hostname "MyFortiGate"
    set timezone 16
    unset guicert-warning
end

# Configure an interface (table entry under system interface)
config system interface
    edit "port1"
        set ip 192.168.1.99/24
        set allowaccess ping https ssh
        set description "WAN link"
    next
    edit "port2"
        set ip 10.0.0.1/24
        set allowaccess ping http ssh
        set alias "Internal LAN"
    next
end

# Nested config within an edit (config firewall address inside a VDOM)
config vdom
    edit "root"
        # Address objects in root VDOM
        config firewall address
            edit "Server1"
                set subnet 10.10.10.0 255.255.255.0
            next
            edit "Server2"
                set subnet 10.10.20.5 255.255.255.255
                set comment "Single host"
            next
        end

        # Example multi-line certificate (as a single string)
        config vpn certificate local
            edit "LocalCert"
                set certificate "-----BEGIN CERTIFICATE-----
MIIFujCCB...
... (certificate body)
...5hbtQ==
-----END CERTIFICATE-----"
            next
        end
    next
end

# Show and get commands (operational mode commands)
show system interface port1
get system status

