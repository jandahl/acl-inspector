services:
  acl-inspector-web:
    build:
      context: ..
      dockerfile: ./Dockersetup/Dockerfile
    image: acl-inspector-web:latest
    ports:
      - "8083:8083"
    volumes:
      - ../configs:/app/configs:ro
      - aclinspector_cache:/app/cache
    environment:
      - ACLINSPECTOR_CACHE_DIR=/app/cache
      - ACLINSPECTOR_SEARCH_LIMIT=${ACLINSPECTOR_SEARCH_LIMIT:-50}
      # Optional per-vendor config roots (can be the same path)
      - ACLINSPECTOR_CONFIGS_CISCO=${ACLINSPECTOR_CONFIGS_CISCO:-/app/configs/cisco}
      - ACLINSPECTOR_CONFIGS_FORTIGATE=${ACLINSPECTOR_CONFIGS_FORTIGATE:-/app/configs/fortigate}
      # Set to 1 to build all search indices at startup (slower start, faster first query)
      - ACLINSPECTOR_PREWARM_ALL=${ACLINSPECTOR_PREWARM_ALL:-0}
    healthcheck:
      # 127.0.0.1 avoids IPv6 loopback resolution on dual-stack hosts
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    # Prevent privilege escalation inside the container
    security_opt:
      - no-new-privileges:true
    # Drop all Linux capabilities — port 8083 is above 1024 (no NET_BIND_SERVICE
    # needed), process runs as uid 1000, and only reads files from mounted volumes.
    cap_drop:
      - ALL
    # Restart on crash but not on explicit stop/down.
    # Note: silently ignored by rootless Podman (lifecycle managed by systemd/user).
    restart: on-failure
    # Give the server 5 s to flush in-flight responses on SIGTERM before SIGKILL.
    stop_grace_period: 5s
    # Limit process count — a Python HTTP server has no reason to fork heavily.
    pids_limit: 50
    # Mount the rootfs read-only; /tmp is a tmpfs (in-memory, lost on restart).
    # The cache volume at /app/cache remains writable.
    read_only: true
    tmpfs:
      - /tmp
    # Block all outbound internet access at runtime.
    # The app reads local config files and serves the web UI — it has no
    # legitimate reason to initiate external connections.
    # Port publishing (8083:8083) still works: that NAT lives on the host,
    # not inside the container network.
    networks:
      - internal

networks:
  internal:
    driver: bridge
    internal: true

volumes:
  aclinspector_cache:
    name: aclinspector_cache
