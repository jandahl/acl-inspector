[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acl-inspector"
version = "0.1.0"
description = "Firewall ACL analysis tool for Cisco ASA and FortiGate configurations"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
# Core install is stdlib-only (matches README). TUI requires textual + rich.
dependencies = []

[project.optional-dependencies]
tui = [
    "rich>=13.0",
    "textual>=0.60",
]

[project.scripts]
# The dispatcher uses subprocess to invoke CLI tools by file path, so an
# editable install (pip install -e .) is required for the console script to
# work correctly. A future refactor to an acl_inspector namespace package
# will resolve both this and the generic top-level package names below.
aclinspector = "aclinspector:main"

[tool.setuptools]
py-modules = ["aclinspector"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "common*",
    "parsers*",
    "analysis_core*",
    "webui*",
    "cli*",
    "tui*",
    "utils*",
]

[tool.setuptools.package-data]
"webui" = ["templates/**", "static/**", "*.html", "*.css", "*.js",
           "*.ttf", "*.woff", "*.woff2", "*.png", "*.svg", "*.ico"]
"*" = ["*.html", "*.css", "*.js", "*.yaml", "*.yml"]
