[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acl-inspector"
version = "0.1.0"
description = "Firewall ACL analysis tool for Cisco ASA and FortiGate configurations"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
# Core install is stdlib-only (matches README). TUI requires textual + rich.
dependencies = []

[project.optional-dependencies]
tui = [
    "rich>=13.0",
    "textual>=0.60",
]

[project.urls]
Homepage = "https://github.com/jandahl/acl-inspector"

[project.scripts]
# The dispatcher uses subprocess to invoke CLI tools by file path, so an
# editable install (pip install -e .) is required for the console script to
# work correctly. This is a consequence of the project using generic top-level
# package names (parsers, common, utils, …) that would collide in site-packages
# on a non-editable install. A future refactor to an acl_inspector namespace
# package will resolve both constraints.
aclinspector = "aclinspector:main"

[tool.setuptools]
# packages.find and package-data are intentionally omitted. Editable installs
# (pip install -e .) work correctly because the project root is added to
# sys.path directly. Non-editable installs are deliberately left incomplete
# until the codebase is reorganised under an acl_inspector namespace package,
# preventing generic top-level names (common, parsers, utils, …) from
# polluting the user's site-packages in the meantime.
py-modules = ["aclinspector"]
