[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acl-inspector"
version = "0.1.0"
description = "Firewall ACL analysis tool for Cisco ASA and FortiGate configurations"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
# Core install is stdlib-only (matches README). TUI requires textual + rich.
dependencies = []

[project.optional-dependencies]
tui = [
    "rich>=13.0",
    "textual>=0.60",
]
external = [
    "ciscoconfparse>=1.9.0,<3",
    "fortios-xutils>=0.0.1",
]
dev = [
    # Both linters are run by `make lint`; ruff is primary, flake8 catches
    # anything ruff doesn't yet cover.
    "ruff",
    "flake8",
]
test = [
    # Browser binary must match the package version; re-run
    # `playwright install chromium` after upgrading.
    "playwright>=1.40",
    "textual>=0.60",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/jandahl/acl-inspector"

[project.scripts]
# The dispatcher uses subprocess to invoke CLI tools by file path, so an
# editable install (pip install -e .) is required for the console script to
# work correctly. This is a consequence of the project using generic top-level
# package names (parsers, common, utils, …) that would collide in site-packages
# on a non-editable install. A future refactor to an acl_inspector namespace
# package will resolve both constraints.
aclinspector = "aclinspector:main"

[tool.setuptools]
py-modules = ["aclinspector"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "common", "common.*",
    "parsers", "parsers.*",
    "analysis_core", "analysis_core.*",
    "webui", "webui.*",
    "cli", "cli.*",
    "tui", "tui.*",
    "utils", "utils.*",
]
exclude = ["tests", "tests.*", "legacy", "legacy.*", "scripts", "scripts.*"]

[tool.setuptools.package-data]
# Only webui ships non-Python assets; avoid catch-all globs that would pull
# in test fixtures or sample configs from other directories.
"webui" = [
    "templates/*", "templates/*/*",
    "static/*", "static/*/*",
    "*.html", "*.css", "*.js",
    "*.yaml", "*.yml",
    "*.ttf", "*.woff", "*.woff2",
    "*.png", "*.svg", "*.ico",
]
