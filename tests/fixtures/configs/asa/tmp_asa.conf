! Test ASA configuration (proper ordering: objects before groups, groups before ACLs)

! Network objects
object network OBJ1
 host 10.0.0.1

! Object groups (define referenced groups first)
object-group network NETGRP2
 network-object host 10.0.0.2

object-group network NETGRP1
 network-object object OBJ1
 network-object 10.0.0.0 255.255.255.0
 group-object NETGRP2

! Access lists
access-list OUTSIDE extended permit ip object-group NETGRP1 any
access-list OUTSIDE extended deny ip any host 10.0.0.3
access-list OUTSIDE extended permit tcp host 10.0.0.1 host 10.0.0.2 eq 443
