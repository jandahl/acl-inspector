# Sample FortiGate configuration for testing IR translation
#config-version=FG200E-7.4.0-FW-build2571-230621:opmode=0:vdom=0

# Firewall addresses (define objects before groups)
config firewall address
    edit "WEB_SERVER"
        set subnet 10.1.1.10 255.255.255.255
    next
    edit "DB_SERVER"
        set subnet 10.1.1.20 255.255.255.255
    next
    edit "APP_NET"
        set subnet 192.168.10.0 255.255.255.0
    next
    edit "DB_NET"
        set subnet 192.168.20.0 255.255.255.0
    next
end

# Firewall address groups (reference objects defined above)
config firewall addrgrp
    edit "BACKEND_SERVERS"
        set member "WEB_SERVER" "DB_SERVER"
    next
    edit "INTERNAL_NETS"
        set member "APP_NET" "DB_NET"
    next
end

# Service custom definitions
config firewall service custom
    edit "WEB_PORTS"
        set tcp-portrange 80 443
    next
    edit "DB_PORT"
        set tcp-portrange 3306
    next
end

# Service groups
config firewall service group
    edit "BACKEND_SERVICES"
        set member "WEB_PORTS" "DB_PORT"
    next
end

# Firewall policies
config firewall policy
    edit 1
        set action accept
        set srcaddr "APP_NET"
        set dstaddr "BACKEND_SERVERS"
        set service "BACKEND_SERVICES"
    next
    edit 2
        set action accept
        set srcaddr "WEB_SERVER"
        set dstaddr "DB_SERVER"
        set service "DB_PORT"
    next
    edit 100
        set action deny
        set srcaddr "all"
        set dstaddr "all"
        set service "ALL"
    next
end
