# Advanced FortiGate sample config exercising VDOM, interfaces, VIP, IP pools, and policy NAT
#config-version=FG200E-7.4.2-FW-build2573-231010:opmode=0:vdom=1

config vdom
    edit "root"

        config system interface
            edit "port1"
                set vdom "root"
                set ip 203.0.113.2 255.255.255.0
                set allowaccess ping https ssh
            next
            edit "port2"
                set vdom "root"
                set ip 10.1.1.1 255.255.255.0
                set allowaccess ping
            next
        end

        config system zone
            edit "wan-zone"
                set interface "port1"
            next
            edit "lan-zone"
                set interface "port2"
            next
        end

        config firewall address
            edit "INTERNAL_NET"
                set subnet 10.1.1.0 255.255.255.0
            next
            edit "DMZ_WEB"
                set subnet 10.1.2.0 255.255.255.0
            next
            edit "DB_HOST"
                set subnet 10.1.3.10 255.255.255.255
            next
        end

        config firewall addrgrp
            edit "SERVER_FARM"
                set member "DMZ_WEB" "DB_HOST"
            next
        end

        config firewall service custom
            edit "HTTP-HTTPS"
                set tcp-portrange 80 443
            next
            edit "DB-TCP"
                set tcp-portrange 1433 1521
            next
        end

        config firewall vip
            edit "WEB-VIP"
                set extip 198.51.100.10
                set mappedip 10.1.2.10
                set extintf "port1"
                set portforward enable
                set extport 443
                set mappedport 443
            next
        end

        config firewall vipgrp
            edit "DMZ_VIPS"
                set member "WEB-VIP"
            next
        end

        config firewall ippool
            edit "OUT_POOL"
                set startip 198.51.100.50
                set endip 198.51.100.60
            next
        end

        config firewall policy
            edit 10
                set name "Publish-Web"
                set uuid 11111111-2222-3333-4444-555555555555
                set srcintf "port1"
                set dstintf "port2"
                set srcaddr "all"
                set dstaddr "DMZ_VIPS"
                set action accept
                set schedule "always"
                set service "HTTP-HTTPS"
                set nat disable
                set logtraffic all
            next
            edit 20
                set name "Users-Internet"
                set uuid aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
                set srcintf "port2"
                set dstintf "port1"
                set srcaddr "INTERNAL_NET"
                set dstaddr "all"
                set action accept
                set schedule "always"
                set service "ALL"
                set nat enable
                set ippool enable
                set poolname "OUT_POOL"
            next
            edit 30
                set name "Web-to-DB"
                set srcintf "port2"
                set dstintf "port2"
                set srcaddr "DMZ_WEB"
                set dstaddr "DB_HOST"
                set action accept
                set schedule "always"
                set service "DB-TCP"
                set nat disable
            next
        end

        config firewall central-snat-map
            edit 1
                set uuid ffffffff-1111-2222-3333-444444444444
                set srcintf "port2"
                set dstintf "port1"
                set orig-addr "INTERNAL_NET"
                set dst-addr "all"
                set nat-ippool "OUT_POOL"
            next
        end

        config router static
            edit 1
                set dst 0.0.0.0/0
                set gateway 203.0.113.1
                set device "port1"
            next
        end

    next
end
