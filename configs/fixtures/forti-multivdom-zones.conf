config vdom
    edit root
        config system zone
            edit "inside-zone"
                set interface "port1" "port2"
            next
        end
        config firewall address
            edit "HQ-NET"
                set subnet 10.0.0.0 255.255.255.0
            next
        end
        config firewall policy
            edit 1
                set name "root-allow"
                set srcintf "inside-zone"
                set dstintf "port3"
                set srcaddr "HQ-NET"
                set dstaddr "all"
                set action accept
                set service "HTTP"
            next
        end
    next
    edit branch
        config system zone
            edit "branch-zone"
                set interface "port5"
            next
        end
        config firewall address
            edit "BR-NET"
                set subnet 10.10.0.0 255.255.255.0
            next
        end
        config firewall addrgrp
            edit "BR-GRP"
                set member "BR-NET"
            next
        end
        config firewall policy
            edit 10
                set name "branch-allow"
                set srcintf "branch-zone"
                set dstintf "port6"
                set srcaddr "BR-GRP"
                set dstaddr "all"
                set action accept
                set service "HTTPS"
            next
        end
    next
end
