config vdom
    edit alpha
        config firewall address
            edit "SRC_TRUST"
                set subnet 192.0.2.0 255.255.255.0
            next
            edit "OLD_WEB"
                set subnet 10.10.10.10 255.255.255.255
            next
            edit "NEW_WEB"
                set subnet 10.10.10.20 255.255.255.255
            next
        end
        config firewall policy
            edit 1
                set name "web-old"
                set srcintf "port1"
                set dstintf "port2"
                set srcaddr "SRC_TRUST"
                set dstaddr "OLD_WEB"
                set action accept
                set service "HTTP"
            next
            edit 2
                set name "web-new"
                set srcintf "port1"
                set dstintf "port2"
                set srcaddr "SRC_TRUST"
                set dstaddr "NEW_WEB"
                set action accept
                set service "HTTP"
            next
        end
    next
end
