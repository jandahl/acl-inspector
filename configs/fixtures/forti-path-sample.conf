config vdom
    edit root
        config firewall address
            edit "SRC_NET"
                set subnet 192.0.2.0 255.255.255.0
            next
            edit "VIP_WEB"
                set extip 203.0.113.10
                set mappedip "10.10.10.10"
            next
        end
        config firewall policy
            edit 1
                set name "vip-allow"
                set srcintf "port1"
                set dstintf "port2"
                set srcaddr "SRC_NET"
                set dstaddr "VIP_WEB"
                set action accept
                set service "HTTP"
            next
        end
    next
end
