!
! Test Config 1 - Firewall FW1
!
interface GigabitEthernet0/1
 nameif outside
 security-level 0
 ip address 192.168.1.1 255.255.255.0
!
interface GigabitEthernet0/2
 nameif inside
 security-level 100
 ip address 10.0.1.1 255.255.255.0
!
! Network Objects - FW1
object network WebServer1
 host 10.0.1.10
object network WebServer2
 host 10.0.1.20
object network DatabaseServer1
 host 10.0.1.30
object network InternalNet
 subnet 10.0.1.0 255.255.255.0
!
! Object Groups - FW1
object-group network WebServers
 network-object object WebServer1
 network-object object WebServer2
object-group network DatabaseServers
 network-object object DatabaseServer1
!
! ACLs - FW1
access-list outside_in extended permit tcp any object WebServer1 eq 443
access-list outside_in extended permit tcp any object WebServer2 eq 80
access-list outside_in extended deny ip any any
!
access-group outside_in in interface outside
