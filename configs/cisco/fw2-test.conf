!
! Test Config 2 - Firewall FW2
!
interface GigabitEthernet0/1
 nameif outside
 security-level 0
 ip address 192.168.2.1 255.255.255.0
!
interface GigabitEthernet0/2
 nameif dmz
 security-level 50
 ip address 172.16.1.1 255.255.255.0
!
! Network Objects - FW2
object network AppServer1
 host 172.16.1.10
object network AppServer2
 host 172.16.1.20
object network LoadBalancer
 host 172.16.1.5
object network DMZNet
 subnet 172.16.1.0 255.255.255.0
!
! Object Groups - FW2
object-group network AppServers
 network-object object AppServer1
 network-object object AppServer2
!
! ACLs - FW2
access-list dmz_in extended permit tcp any object LoadBalancer eq 443
access-list dmz_in extended permit tcp any object-group AppServers eq 8080
access-list dmz_in extended deny ip any any
!
access-group dmz_in in interface dmz
