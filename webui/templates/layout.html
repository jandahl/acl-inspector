<!doctype html>
<html style="background:#000">
  <head>
    <meta charset="utf-8">
    <title>ACL Inspector</title>
    <link rel="stylesheet" href="/static/app.css">
    <link rel="stylesheet" href="/static/themes.css">
    <link rel="stylesheet" href="/static/fonts/local.css">
    <script>
      window.ACL_THEMES = $themes_json;
      window.ACL_CONFIG_OPTIONS = $config_options;
      window.ACL_VENDOR_CAPS = $vendor_caps;
      window.ACL_HISTORY_ENABLED = $history_enabled;
      window.ACL_SEARCH_LIMIT = $search_limit;
      window.ACL_VERSION = "$version";
      window.ACL_BETA_MODULES = $beta_modules;
      window.ACL_THEME_PREVIEW_SPEED = $theme_preview_speed;
    </script>
    <script defer src="$app_js_url"></script>
  </head>
  <body class="theme-dark">
    <div id="boot_status" class="boot-status" role="alert" aria-live="polite"></div>
    <div class="app">
      <div class="toolbar">
        <h2>ACL Inspector</h2>
        <div class="toolbar-controls">
          <div class="theme-mode-group" role="group" aria-label="Color scheme">
            <button type="button" id="themeModeLight" class="toolbar-icon-btn" data-theme-mode="light" aria-pressed="false" aria-label="Light mode">
              <svg viewBox="0 0 24 24" width="16" height="16" focusable="false" aria-hidden="true">
                <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"></circle>
                <line x1="12" y1="2" x2="12" y2="5" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
                <line x1="12" y1="19" x2="12" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
                <line x1="4.22" y1="4.22" x2="6.34" y2="6.34" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
                <line x1="17.66" y1="17.66" x2="19.78" y2="19.78" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
                <line x1="2" y1="12" x2="5" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
                <line x1="19" y1="12" x2="22" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
                <line x1="4.22" y1="19.78" x2="6.34" y2="17.66" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
                <line x1="17.66" y1="6.34" x2="19.78" y2="4.22" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
              </svg>
            </button>
            <button type="button" id="themeModeDark" class="toolbar-icon-btn" data-theme-mode="dark" aria-pressed="false" aria-label="Dark mode">
              <svg viewBox="0 0 24 24" width="16" height="16" focusable="false" aria-hidden="true">
                <path d="M21 12.79A9 9 0 0111.21 3a7 7 0 000 14 9 9 0 009.79-4.21z" fill="currentColor"></path>
              </svg>
            </button>
            <button type="button" id="themeModeAuto" class="toolbar-icon-btn" data-theme-mode="auto" aria-pressed="true" aria-label="Auto mode (follow system)">
              <svg viewBox="0 0 24 24" width="16" height="16" focusable="false" aria-hidden="true">
                <rect x="2" y="4" width="20" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"></rect>
                <line x1="8" y1="21" x2="16" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
                <line x1="12" y1="18" x2="12" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
              </svg>
            </button>
          </div>
          <label class="hl-switch"><input type="checkbox" id="hlToggle"> Highlight output</label>
          <button type="button" id="histToggle" class="history-toggle">History</button>
          <button type="button" id="settingsBtn" class="toolbar-icon-btn" aria-label="Settings">
            <svg viewBox="0 0 24 24" width="16" height="16" focusable="false" aria-hidden="true">
              <path fill="currentColor" d="M12 9.5a2.5 2.5 0 102.5 2.5A2.5 2.5 0 0012 9.5zm9.44 2a7.72 7.72 0 00-.1-1l2.11-1.65a.5.5 0 00.12-.64l-2-3.46a.5.5 0 00-.6-.22l-2.49 1a7.74 7.74 0 00-1.73-1L16.4 2.6a.5.5 0 00-.5-.6h-3.8a.5.5 0 00-.5.4l-.38 2.68a7.93 7.93 0 00-1.73 1l-2.49-1a.5.5 0 00-.6.22l-2 3.46a.5.5 0 00.12.64l2.11 1.65A7.72 7.72 0 004.56 12a7.72 7.72 0 00.1 1l-2.11 1.65a.5.5 0 00-.12.64l2 3.46a.5.5 0 00.6.22l2.49-1a7.74 7.74 0 001.73 1l.38 2.68a.5.5 0 00.5.4h3.8a.5.5 0 00.5-.4l.38-2.68a7.93 7.93 0 001.73-1l2.49 1a.5.5 0 00.6-.22l2-3.46a.5.5 0 00-.12-.64l-2.11-1.65a7.72 7.72 0 00.1-1z"></path>
            </svg>
          </button>
          <button type="button" id="helpBtn" class="toolbar-icon-btn" aria-label="About / help">
            <svg viewBox="0 0 24 24" width="16" height="16" focusable="false" aria-hidden="true">
              <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"></circle>
              <path d="M10 9a2 2 0 114 0c0 1.5-2 2-2 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
              <circle cx="12" cy="17" r="0.5" fill="currentColor" stroke="currentColor" stroke-width="1.5"></circle>
            </svg>
          </button>
        </div>
      </div>
      <div class="tab-shell">
        <div class="mode-tabs">
          <button type="button" class="tab active" data-tab="rules">Inspect / Compare</button>
          <button type="button" class="tab" data-tab="find" data-requires="find">Find host</button>
          <button type="button" class="tab" data-tab="packet" data-requires="packet" data-beta-module="packet-check" data-beta-optional="1">Packet check<span class="badge beta" data-beta-badge="packet-check">Beta</span></button>
          <button type="button" class="tab" data-tab="packet-probe" data-requires="packet" data-beta-module="packet-probe" data-beta-optional="1">Packet probe<span class="badge beta" data-beta-badge="packet-probe">Beta</span></button>
          <button type="button" class="tab" data-tab="config">Config Viewer</button>
          <button type="button" class="tab" data-tab="prefs">Preferences</button>
          <button type="button" class="tab" data-tab="about">About</button>
        </div>
        <form class="form" method="POST" action="/run">
          <fieldset class="section section-config">
            <legend>Config</legend>
            <label>Vendor:</label>
            <select name="vendor" id="vendor">
              <option value="asa" selected>ASA</option>
              <option value="fortigate">FortiGate</option>
            </select>
            <span id="meta" class="meta"></span><br>
            <div id="asa_cfg">
              <label>ASA Config:</label>
              <select name="config" id="config">
                $asa_options
              </select>
            </div>
            <div id="ftg_cfg" style="display:none">
              <label>FortiGate Config:</label>
              <select name="config" id="config_ftg">
                $fortigate_options
              </select>
            </div>
            <div id="ftg_vdom" style="display:none">
              <label>FortiGate VDOM:</label>
              <input type="text" name="vdom" id="vdom" placeholder="root" class="mono-input">
            </div>
          </fieldset>
          <input type="hidden" name="mode" id="mode" value="inspect">
          <input type="hidden" name="history_replay" id="history_replay" value="0">
          <div class="search-options global-search">
            <label><input type="checkbox" id="fuzzy" checked> Fuzzy search</label>
          </div>
          <fieldset class="section section-service" id="service_filters">
            <legend>Service Filter</legend>
            <label>Protocol:</label>
            <select name="proto">
              <option value="">Any</option>
              <option value="tcp">TCP</option>
              <option value="udp">UDP</option>
              <option value="icmp">ICMP</option>
              <option value="ip">IP</option>
            </select>
            <label>Destination ports (comma separated):</label>
            <input type="text" name="dport" placeholder="443,1433" class="mono-input">
            <label id="include_any_label"><input type="checkbox" name="include_any" id="include_any"> Include rules with 'any' <span class="tip" title="By default, rules with any src/dst are skipped to reduce noise. Check to include them.">?</span></label>
          </fieldset>
          <div class="tab-panels">
            $tab_rules
            $tab_find
            $tab_packet
            $tab_packet_probe
            $tab_config
            $tab_prefs
            $tab_about
          </div>
        </form>
      </div>
      <aside id="history" class="history" style="display:none"></aside>
    </div>
    <datalist id="targets"></datalist>
  </body>
</html>
