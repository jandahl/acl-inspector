<section id="tab-prefs" class="tab-panel">
  <fieldset class="section section-prefs">
    <legend>Preferences</legend>
    <div class="theme-control">
      <label for="theme_dark">Dark theme:</label>
      <select id="theme_dark"></select>
      <span class="theme-preview" id="preview_dark"></span>
    </div>
    <div class="theme-control">
      <label for="theme_light">Light theme:</label>
      <select id="theme_light"></select>
      <span class="theme-preview" id="preview_light"></span>
    </div>
    <p class="pref-note">Theme choices are remembered locally so your dark/light toggle keeps the look you pick.</p>
  </fieldset>
</section>
